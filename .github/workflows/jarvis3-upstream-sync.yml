# Weekly upstream merge (JARVIS3.md, "Staying on upstream"): merges getpaseo/paseo main into a new
# branch `upstream-sync-<upstream sha>` made from main, runs the jarvis3 checks on it and opens a PR
# that lands with the normal merge button. Nothing is ever force-pushed: each upstream commit gets
# its own branch, and a branch that already exists is left alone. A conflict fails the job,
# listing the files, and pushes nothing.
#
# GITHUB_TOKEN can't push a branch that changes .github/workflows/*, which upstream often does.
# The repo secret SYNC_TOKEN (a fine-grained token for this repo only: contents, pull requests and
# workflows read/write) is used when it exists.
name: jarvis3 upstream sync

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: jarvis3-upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
      upstream: ${{ steps.merge.outputs.upstream }}
      branch: ${{ steps.merge.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Merge upstream
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/getpaseo/paseo.git
          git fetch --no-tags upstream main
          short=$(git rev-parse --short=9 upstream/main)
          branch="upstream-sync-${short}"
          echo "upstream=${short}" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "main already contains upstream/main" >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Branch ${branch} already exists; its PR covers this upstream commit." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git switch -c "$branch"
          if ! git merge --no-edit -m "Merge upstream getpaseo/paseo ${short}" upstream/main; then
            {
              echo "## Merging upstream/main conflicts"
              echo
              git diff --name-only --diff-filter=U | sed 's/^/- /'
              echo
              echo 'Resolve by hand: `git fetch upstream && git merge upstream/main` (JARVIS3.md).'
            } >> "$GITHUB_STEP_SUMMARY"
            git merge --abort
            exit 1
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --quiet package-lock.json; then
            git commit -qam "jarvis3: refresh package-lock after merging upstream"
          fi
          if ! git push origin "HEAD:refs/heads/${branch}"; then
            {
              echo "## Push refused"
              echo
              echo "The merge likely changes .github/workflows/*, which GITHUB_TOKEN can't push."
              echo "Add the SYNC_TOKEN secret (see the header of this workflow) or merge by hand."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

  checks:
    needs: merge
    if: ${{ needs.merge.outputs.changed == 'true' }}
    uses: ./.github/workflows/jarvis3.yml
    with:
      ref: ${{ needs.merge.outputs.branch }}

  pull-request:
    needs: [merge, checks]
    if: ${{ always() && needs.merge.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Open the PR
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          CHECKS: ${{ needs.checks.result }}
          UPSTREAM: ${{ needs.merge.outputs.upstream }}
          BRANCH: ${{ needs.merge.outputs.branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$(cat <<BODY
          Merges getpaseo/paseo main (${UPSTREAM}) into main.

          jarvis3 checks: **${CHECKS}** (${RUN_URL}).

          Land it with the merge button ("Create a merge commit"). Close any older upstream-sync PR.
          BODY
          )
          gh pr create -R "$REPO" --base main --head "$BRANCH" \
            --title "Merge upstream ${UPSTREAM}" --body "$body"
