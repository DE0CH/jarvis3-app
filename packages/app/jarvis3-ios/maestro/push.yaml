# Push notifications on the simulator (the app is paired): the sidebar's Notices -> Notification settings ->
# Turn on -> allow notifications. The app asks iOS for an APNs token and registers it with the
# mock instance, whose log gets the token (simulator-test.sh prints whether one arrived). A
# simulator on a CI virtual machine may get no token from Apple; the screen then says so.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: "menu-button"
    timeout: 60000
- tapOn:
    id: "menu-button"
- extendedWaitUntil:
    visible:
      id: "jarvis3-nav-notices"
    timeout: 20000
- tapOn:
    id: "jarvis3-nav-notices"
- extendedWaitUntil:
    visible:
      id: "jarvis3-push-settings"
    timeout: 30000
- tapOn:
    id: "jarvis3-push-settings"
- extendedWaitUntil:
    visible:
      id: "jarvis3-push-on"
    timeout: 30000
- takeScreenshot: 8-push-off
- tapOn:
    id: "jarvis3-push-on"
- extendedWaitUntil:
    visible: ".*Would Like to Send You Notifications.*"
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible: ".*Would Like to Send You Notifications.*"
    commands:
      - tapOn: "Allow"
- extendedWaitUntil:
    visible: ".*(On for this device|couldn.t register|weren.t allowed).*"
    timeout: 60000
- takeScreenshot: 9-push-result
