# Fresh install against the mock instance: pair through the system sign-in sheet; the app then
# opens on an empty chat with the composer focused, loaded with the device token
# (CF-Access-Client-Id/Secret); a first message creates the chat, which shows in the sidebar.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
# upstream's push code asks for notification permission at start; the alert covers the page
- extendedWaitUntil:
    visible: ".*Would Like to Send You Notifications.*"
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible: ".*Would Like to Send You Notifications.*"
    commands:
      - tapOn: "Don.t Allow"
- extendedWaitUntil:
    visible:
      id: "jarvis3-sign-in"
    timeout: 90000
- takeScreenshot: 1-sign-in
- tapOn:
    id: "jarvis3-sign-in"
# ASWebAuthenticationSession asks before opening the sheet
- extendedWaitUntil:
    visible: "Continue"
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- extendedWaitUntil:
    visible: "Sign in as alice@example.org"
    timeout: 30000
- takeScreenshot: 2-mock-sign-in
- tapOn: "Sign in as alice@example.org"
# Let the sheet's SafariViewService exit before the next hierarchy query: querying it while it
# shuts down fails Maestro's XCTest driver ("SafariViewService is not running") and the run dies.
- waitForAnimationToEnd:
    timeout: 10000
# the first screen: an empty chat, the composer ready to type into
- extendedWaitUntil:
    visible: "What can I help with?"
    timeout: 60000
- assertVisible:
    id: "jarvis3-composer-input"
- takeScreenshot: 3-new-chat
- tapOn:
    id: "jarvis3-composer-input"
- inputText: "Summarise the onboarding handbook"
- takeScreenshot: 4-typed
- tapOn:
    id: "jarvis3-composer-send"
# the chat opens with the message and a quiet "Starting…" while the agent wakes
- extendedWaitUntil:
    visible:
      id: "jarvis3-chat-starting"
    timeout: 60000
- assertVisible: "Summarise the onboarding handbook"
- takeScreenshot: 5-chat-starting
# the sidebar (the drawer from the menu button) lists it with the user's other chats
- tapOn:
    id: "menu-button"
- extendedWaitUntil:
    visible:
      id: "jarvis3-sidebar"
    timeout: 20000
- assertVisible: "Draft the Q3 supplier summary"
- assertVisible: "Summarise the onboarding handbook"
- takeScreenshot: 6-sidebar
- tapOn:
    id: "jarvis3-sidebar-close"
